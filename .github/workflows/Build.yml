name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unzip and prepare
        run: |
          unzip ShizukuFM.zip
          echo "android.useAndroidX=true" > ShizukuFM/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g" >> ShizukuFM/gradle.properties
      - name: Build
        run: cd ShizukuFM && gradle assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ShizukuFM/app/build/outputs/apk/debug/app-debug.apk
